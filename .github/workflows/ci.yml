name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project apps/api --all-groups --locked
      - run: uv run --project apps/api ruff check apps/api
      - run: uv run --project apps/api ruff format --check apps/api
      - run: uv run --project apps/api pytest apps/api/tests --cov=tracewell_api --cov-report=term-missing --cov-fail-under=80

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run build:web

