services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracewell
      POSTGRES_USER: tracewell
      POSTGRES_PASSWORD: tracewell
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracewell -d tracewell"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - tracewell_postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://tracewell:tracewell@db:5432/tracewell
      TRACEWELL_ENV: development
      TRACEWELL_INGEST_TOKEN: ${TRACEWELL_INGEST_TOKEN:-}
      TRACEWELL_AUTO_CREATE_SCHEMA: "true"
      TRACEWELL_CORS_ORIGINS: http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  tracewell_postgres:
