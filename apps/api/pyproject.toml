[project]
name = "tracewell-api"
version = "0.1.0"
description = "OTLP ingestion and query API for Tracewell"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "google-adk==2.9.2",
  "litellm==1.101.0",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-proto>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "protobuf>=5,<7",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracewell_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.coverage.run]
branch = true
source = ["tracewell_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
